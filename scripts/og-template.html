<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #fbfbfa; color: #1a1a1e; font-family: Inter, "Noto Sans Thai", "Noto Sans SC", sans-serif; }
  body.ja { font-family: Inter, "Noto Sans JP", sans-serif; }
  .grid { position: absolute; inset: 0 0 0 640px; background-image: radial-gradient(#dcdcd8 1.2px, transparent 1.2px); background-size: 22px 22px; }
  .wrap { position: relative; display: flex; height: 100%; padding: 64px 72px; gap: 48px; }
  .left { flex: 1; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .brand em { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: #2b379f; font-size: 38px; }
  h1 { margin-top: 56px; font-size: 64px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 700; }
  body.th h1 { font-size: 58px; line-height: 1.24; letter-spacing: -0.01em; word-break: keep-all; }
  body.zh h1, body.ja h1 { font-size: 56px; line-height: 1.24; letter-spacing: 0; }
  h1 i, .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: #2b379f; letter-spacing: -0.01em; }
  .serif { margin-top: 18px; font-size: 40px; }
  .meta { margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { border: 1.5px solid rgba(26,26,30,0.14); background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 18px; font-weight: 500; color: #5c5c66; }
  .chip b { color: #1a1a1e; font-weight: 700; }
  .card { width: 400px; align-self: center; background: #fff; border: 1.5px solid rgba(26,26,30,0.08); border-radius: 34px; box-shadow: 0 4px 10px rgba(20,20,30,.05), 0 30px 60px -20px rgba(20,20,30,.22); overflow: hidden; }
  .card .top { padding: 20px 26px; border-bottom: 1.5px solid rgba(26,26,30,0.08); font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #2b379f; }
  .stage { height: 200px; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(rgba(26,26,30,0.14) 1.2px, transparent 1.2px); background-size: 18px 18px; position: relative; }
  .btn { background: #3343c4; color: #fff; font-size: 26px; font-weight: 600; padding: 20px 40px; border-radius: 999px; box-shadow: 0 10px 24px -8px rgba(51,67,196,.55); outline: 3px solid #3343c4; outline-offset: 5px; }
  .cursor { position: absolute; left: 248px; top: 128px; width: 34px; height: 34px; }
  .card .bottom { padding: 20px 26px 24px; }
  .said { font-size: 21px; font-weight: 600; }
  .tags { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .tag { border: 1.5px solid rgba(26,26,30,0.14); border-radius: 999px; padding: 6px 13px; font-size: 17px; color: #5c5c66; font-family: Inter, sans-serif; }
  .tag.on { background: #eef0fc; border-color: transparent; color: #2b379f; font-weight: 600; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <svg width="54" height="54" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="9" fill="#3343c4"/><rect x="7" y="9.5" width="18" height="9" rx="4.5" fill="#fff" opacity=".28"/><path d="M15.2 12.6v10.6l2.7-2.5 1.9 4.3 2-0.9-1.9-4.2h3.7z" fill="#fff" stroke="#3343c4" stroke-width=".9" stroke-linejoin="round"/></svg>
        <span>Thai<em>UX</em></span>
      </div>
      <h1 id="title"></h1>
      <p class="serif" id="serif">Learn UX by experiencing it.</p>
      <div class="meta" id="meta"></div>
    </div>
    <div class="card">
      <div class="top" id="label"></div>
      <div class="stage">
        <span class="btn" id="btn"></span>
        <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3.1 7 3.3-1.5-3.1-6.8h6.2z" fill="#1a1a1e" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
      <div class="bottom">
        <p class="said" id="said"></p>
        <div class="tags"><span class="tag on">✓ Hover</span><span class="tag on">✓ Focus</span><span class="tag">Active</span><span class="tag">Feedback</span></div>
      </div>
    </div>
  </div>
</body>
</html>
